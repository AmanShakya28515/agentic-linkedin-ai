[build]
builder = "nixpacks"

[deploy]
# Phase 23 — Railway deployment config
# collectstatic runs before gunicorn starts — whitenoise serves the files
startCommand = "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/api/agents/chat/"
restartPolicyType = "on_failure"
